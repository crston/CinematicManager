# CinematicManager Configuration

language: "en"

skip-settings:
  use-shift: true
  use-f: false
  require-both: false

# Dialogue display (title / actionbar / both / bossbar)
dialogue:
  display-mode: title
  page-separator: "||"
  click-proxy: true

  typing:
    enabled: true
    ticks-per-char: 2
    click-completes: true
    sound: ui.button.click
    volume: 0.35
    pitch: 1.7

# AI가 생성한 YAML을 /cinematic import로 가져올 때의 안전 정책
ai-import:
  # true이면 YAML의 executor: console 명령이 서버 권한으로 실행될 수 있습니다.
  allow-console-commands: false

performance:
  # 녹화가 무한히 메모리를 점유하지 않도록 제한합니다. 12000틱 = 10분
  max-recording-ticks: 12000
  # 환경(블록/파티클/사운드/가짜엔티티) 녹화
  env-record-radius: 24
  max-env-recording-ticks: 2400

debug-mode: false
save-path: "data"
