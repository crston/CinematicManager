# CinematicManager Configuration

language: "en"

skip-settings:
  use-shift: true
  use-f: false
  require-both: false

# Dialogue: BetterHud popup 연동 (플러그인 softdepend)
dialogue:
  # betterhud | bossbar(폴백)
  display-mode: betterhud
  page-separator: "||"
  click-proxy: true

  typing:
    enabled: true
    ticks-per-char: 2
    click-completes: true
    sound: ui.button.click
    volume: 0.35
    pitch: 1.7

  # 자동 줄바꿈 (시각 폭: 영문 1, 한글/기타 2)
  wrap:
    enabled: true
    # 한 줄 시각 폭 (영문1 / 한글2) — 상자 안(~14~16글자 한글)에 맞춤
    max-width: 24
    max-lines: 4

debug-mode: false
save-path: "data"
