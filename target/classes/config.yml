# CinematicManager Configuration

language: "en"

skip-settings:
  use-shift: true
  use-f: false
  require-both: false

# Dialogue: BetterHud popup 연동 (플러그인 softdepend)
dialogue:
  # betterhud | bossbar(폴백)
  display-mode: betterhud
  page-separator: "||"
  click-proxy: true

  typing:
    enabled: true
    ticks-per-char: 2
    click-completes: true
    sound: ui.button.click
    volume: 0.35
    pitch: 1.7

  # 자동 줄바꿈 (시각 폭: 영문 1, 한글/기타 2)
  wrap:
    enabled: true
    # 한 줄 시각 폭 (영문1 / 한글2) — 상자 안(~14~16글자 한글)에 맞춤
    max-width: 24
    max-lines: 4

# AI가 생성한 YAML을 /cinematic import로 가져올 때의 안전 정책
ai-import:
  # true이면 YAML의 executor: console 명령이 서버 권한으로 실행될 수 있습니다.
  allow-console-commands: false

performance:
  # 녹화가 무한히 메모리를 점유하지 않도록 제한합니다. 12000틱 = 10분
  max-recording-ticks: 12000

debug-mode: false
save-path: "data"
